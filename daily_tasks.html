<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F9FAFB;
            margin: 0;
            padding: 0;
            text-align: center;
            background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20210923/pngtree-health-care-cartoon-style-light-and-shadow-background-image_904163.png');
            background-size: cover;
            background-position: center;
        }

        h1 {
            color: #007BFF;
            margin-top: 30px;
        }

        .task-container {
            width: 50%;
            margin: 20px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: left;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        li.completed {
            color: #6c757d;
        }

        input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .message {
            margin: 20px;
            color: #28A745;
            font-weight: bold;
        }

        .error {
            color: #DC3545;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #007BFF;
            color: white;
        }

        .chat-btn {
            background-color: #28A745;
            color: white;
        }

    </style>
</head>

<body>

<h1>Daily Tasks</h1>

{% if message %}
    <div class="message">
        {{ message }}
    </div>
{% endif %}

<form method="POST" action="{{ url_for('daily_tasks') }}">

    <div class="task-container">
        <ul>
            {% for code, label in tasks %}
                <li class="{% if existing and existing[code] == 'on' %}completed{% endif %}">
                    <label>
                        <input
                            type="checkbox"
                            name="{{ code }}"
                            {% if existing and existing[code] == 'on' %}checked{% endif %}
                        >
                        {{ label }}
                    </label>
                </li>
            {% endfor %}
        </ul>
    </div>

    <div class="buttons">
        <button type="submit" class="submit-btn">
            {% if existing %}Update Tasks{% else %}Submit{% endif %}
        </button>
        <a href="{{ url_for('index') }}">
            <button type="button" class="chat-btn">Go to Chat</button>
        </a>
    </div>

</form>

</body>
</html>
